{% extends "common/base.html" %}

{% block page_css %}
<link rel="stylesheet" href="{% static 'css/users/index.css' %}">
{% endblock %}

{% block content %}
<div class="auth-wrapper">
{% if user.is_authenticated %}
    <a href="{% url 'runs:program-runs' %}">
{% else %}
    <a href="{% url 'users:login' %}">
{% endif %}   
        <img src="{% static 'img/logpon_logo.png' %}" class="logo-img" alt="ログぽんロゴ">
    </a>
    <a href="{% url 'users:login' %}" class="btn">ログイン</a>
    <a href="{% url 'users:signup' %}" class="btn">新規登録</a>

</div>
{% endblock %}
